<p id="loginError" class="error" hidden></p></form></section><section id="dashboardView" class="hidden"><div class="admin-head"><div><p class="eyebrow">PRIVATE DASHBOARD</p><h1>Upcoming bookings.</h1></div><div class="top-actions"><button class="small-btn" id="refresh">Refresh</button><button class="small-btn" id="logout">Sign out</button></div></div><div class="panel" style="max-width:none"><p class="muted" id="count"></p><div style="overflow:auto"><table class="booking-table"><thead><tr><th>Date</th><th>Time</th><th>Name</th><th>Email</th><th>WhatsApp</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const CONFIG={supabaseUrl:"https://ocngkvafjfdnvnhzrsgj.supabase.co",supabaseAnonKey:"sb_publishable_YUwdBmImnimtIj5aef-84Q_wOQWusP_"},sb=supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey),loginView=document.getElementById("loginView"),dash=document.getElementById("dashboardView");async function init(){const{data}=await sb.auth.getSession();if(data.session){loginView.classList.add("hidden");dash.classList.remove("hidden");load()}}async function load(){const{data,error}=await sb.from("bookings").select("*").eq("status","confirmed").gte("slot_start",new Date().toISOString()).order("slot_start");if(error){document.getElementById("count").textContent=error.message;return}document.getElementById("count").textContent=`${data.length} upcoming booking${data.length===1?"":"s"}`;document.getElementById("rows").innerHTML=data.map(b=>{const d=new Date(b.slot_start);return`<tr><td>${d.toLocaleDateString("en-GB",{timeZone:"Africa/Lagos",weekday:"short",day:"2-digit",month:"short",year:"numeric"})}</td><td>${d.toLocaleTimeString("en-US",{timeZone:"Africa/Lagos",hour:"numeric",minute:"2-digit"})}</td><td>${esc(b.full_name)}</td><td>${esc(b.email)}</td><td>${esc(b.whatsapp)}</td></tr>`}).join("")||'<tr><td colspan="5">No upcoming bookings yet.</td></tr>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});if(error){loginError.textContent=error.message;loginError.hidden=false}else{loginView.classList.add("hidden");dash.classList.remove("hidden");load()}};document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById("refresh").onclick=load;init();</script></body></html>
